[project]
name = "meshfx"
version = "0.1.0"
description = "Forensic parser for data stored on Meshtastic radios and companion apps"
requires-python = ">=3.10"
dependencies = ["protobuf>=7", "littlefs-python>=0.19"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
meshfx = "meshfx.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meshfx*"]
